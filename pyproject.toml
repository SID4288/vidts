[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vidts"
version = "0.1.0"
description = "Video Intelligent Document-to-Story: Turn PDFs into narrated recap videos"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "vidts maintainers" }
]
dependencies = [
    "pypdf>=5.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
vidts = "app.main:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["output*", "prompts*", "tests*", "docs*", "examples*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",  # Line length handled by ruff format
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

