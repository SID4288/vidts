# vidts configuration file

llm:
  provider: groq
  model: "groq/compound-mini"
  base_url: "https://api.groq.com/openai/v1"
  timeout_seconds: 60

document:
  max_pages: null  # null to parse all pages, or an integer limit (e.g. 50)

segmentation:
  enabled: true
  max_duration_minutes: 10
  max_script_words: 1800
  max_pages_per_video: null

narration:
  engine: "edge-tts"
  voice: "en-US-BrianNeural"  # Highly natural, expressive storyteller voice
  rate: "+0%"
  volume: "+0%"

output:
  directory: "output"

video:
  resolution: "1920x1080"
  fps: 30
